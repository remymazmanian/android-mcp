[project]
name = "android-mcp"
version = "0.1.0"
description = "Local MCP server that lets AI assistants control an Android emulator through adb"
authors = [{ name = "Remy Mazmanian" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pillow>=12.0",
]

[project.scripts]
android-mcp = "android_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
