[project]
name = "android-mcp"
version = "0.1.0"
description = "Local MCP server that lets AI assistants control an Android emulator through adb"
authors = [{ name = "Remy Mazmanian" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "android", "adb", "emulator", "ai-agents"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pillow>=12.0",
]

[project.urls]
Homepage = "https://remymazmanian.com/android-mcp/"
Repository = "https://github.com/remymazmanian/android-mcp"
Issues = "https://github.com/remymazmanian/android-mcp/issues"

[project.scripts]
android-mcp = "android_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
